name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PlanetSim.slnx
      - run: dotnet build PlanetSim.slnx --configuration Release --no-restore
      - run: dotnet test PlanetSim.slnx --configuration Release --no-build

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: >-
          dotnet publish src/PlanetSim.Rendering/PlanetSim.Rendering.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained false
          --output artifacts/${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: PlanetSim-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}
